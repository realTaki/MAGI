<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAGI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="view startup">
      <div class="progress">
        <div
          class="progress-track"
          role="progressbar"
          aria-label="MAGI startup progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="startup-progress" class="progress-fill"></div>
        </div>
        <span id="startup-percent" class="progress-percent">0%</span>
      </div>

      <p id="startup-step" class="status" role="status" aria-live="polite">Starting…</p>
      <button type="button" class="retry" id="retry-startup" hidden>Retry</button>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
