<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAGI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="chrome">
        <div class="traffic-spacer" aria-hidden="true"></div>
        <div class="chrome-title">MAGI</div>
      </header>

      <main id="view-startup" class="view startup">
        <p class="eyebrow">MAGI</p>
        <h1>Starting local MAGI</h1>
        <p id="startup-message" class="lede">Preparing MAGI…</p>
        <div class="progress-track" role="progressbar" aria-label="MAGI startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="startup-progress" class="progress-fill"></div>
        </div>
        <p id="startup-step" class="status">Preparing local runtime</p>
        <button type="button" class="retry" id="retry-startup" hidden>Retry</button>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
