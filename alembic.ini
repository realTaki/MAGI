[alembic]
# The migration package lives with the runtime so the same image can migrate
# its own SQLite workspace during startup.
script_location = %(here)s/magi/agent/db/alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///./magi.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
