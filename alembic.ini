[alembic]
# The migration package lives with the runtime so the same image can migrate
# its own SQLite workspace during startup.
script_location = %(here)s/magi/bus/db/alembic
prepend_sys_path = .
path_separator = os
# Intentionally EMPTY. Alembic's env.py overrides this on every run
# via ``config.set_main_option("sqlalchemy.url", ...)`` based on the
# state dir passed to ``upgrade_head`` / ``stamp_baseline``. A
# non-empty default here (``sqlite:///./magi.db``) was a footgun: a
# bare ``alembic upgrade head`` from a checkout without
# the state dir derives from ``MAGI_WORKSPACE_DIR`` and leave a
# stray DB file in the repo root.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
