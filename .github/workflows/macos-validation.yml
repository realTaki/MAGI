name: macOS lifecycle validation (no release)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: Native Darwin process ownership and profile bootstrap
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Bootstrap MAGI-owned runtime
        run: |
          npm ci
          npm_execpath="$(npm root -g)/npm/bin/npm-cli.js" node_modules/node/bin/node apps/shell/scripts/prepare-runtime.mjs
      - name: Build runtime and exercise native lifecycle and Git migrations
        run: |
          export PATH="$PWD/apps/shell/runtime/bin:$PATH"
          apps/shell/runtime/bin/node apps/shell/runtime/npm/node_modules/npm/bin/npm-cli.js run build
          apps/shell/runtime/bin/node apps/shell/runtime/npm/node_modules/npm/bin/npm-cli.js run build:ui --prefix apps/shell
          apps/shell/runtime/bin/node --test apps/shell/test/process-table.test.mjs apps/shell/test/shutdown.test.mjs apps/shell/test/profile-layout.test.mjs
