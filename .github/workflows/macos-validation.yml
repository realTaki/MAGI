name: macOS DSH validation (no release)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
# DSH source validation only; the Desktop is supplied by DSH.
permissions:
  contents: read
concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: DSH plugin lifecycle and contracts (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Bootstrap MAGI-owned runtime
        run: |
          npm ci
          npm_execpath="$(npm root -g)/npm/bin/npm-cli.js" node_modules/node/bin/node scripts/prepare-runtime.mjs
      - name: DSH source, resources and complete plugin regression suite
        run: |
          export PATH="$PWD/runtime/bin:$PATH"
          runtime/bin/node runtime/npm/node_modules/npm/bin/npm-cli.js test
