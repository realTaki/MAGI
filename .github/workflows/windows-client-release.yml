name: Windows 客户端 release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    # A release build normally takes minutes. Keep a leaked child process or
    # stalled external download from consuming a runner for GitHub's six-hour
    # default.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/shell
        # The version check below is bash. windows-latest defaults to PowerShell.
        shell: bash

    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/asp/package-lock.json
            apps/shell/package-lock.json
            apps/user/package-lock.json

      - name: Install dependencies
        # `npm ci` is faster than `npm install` on a CI cache hit and refuses to
        # silently mutate the lockfile. Scripts stay enabled: Electron's
        # postinstall is what unpacks its binary, and dugite/better-sqlite3
        # require their native steps.
        working-directory: .
        run: npm ci

      - name: Restore prepared runtime
        # Include the shell package-lock hash so a dep bump drops the cache
        # instead of leaving a stale npm/Node in `apps/shell/runtime`.
        uses: actions/cache@v5
        with:
          path: apps/shell/runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('apps/shell/package-lock.json', 'apps/shell/scripts/prepare-runtime.mjs') }}
          restore-keys: |
            runtime-${{ runner.os }}-

      - name: Cache electron-builder
        # electron-builder downloads winCodeSign, the nsis installer, and the
        # Windows Electron binary on first build (hundreds of MB). On Windows
        # runners these land in %LOCALAPPDATA%\electron-builder, which
        # `setup-node`'s built-in npm cache does not cover. The shell
        # package-lock pins the electron / electron-builder versions, so use
        # its hash as the cache key.
        if: hashFiles('apps/shell/package-lock.json') != ''
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('apps/shell/package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Test app
        # `magi-runtime.test.ts` covers worktree creation, failure fallback,
        # merge/restart and rebuild flows — none of which run elsewhere today
        # (this repo has no PR workflow that re-executes them). The single test
        # that's expensive on the Windows runner is the live "a real MAGI boots
        # from its own checkout" integration test, which clones the repo and
        # runs `npm ci` + `npm run build` inside it. Gate just that one test
        # off via an env var so the rest of the file keeps running.
        env:
          MAGI_SKIP_LIVE_INTEGRATION: '1'
        run: npm test --prefix ../user

      - name: Build shell
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # WIN_CSC_LINK is a base64 .pfx, separate from the Apple CSC_LINK secret.
          # With neither set, electron-builder still produces an unsigned installer.
          if [[ -z "${WIN_CSC_LINK:-}" ]]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD CSC_LINK CSC_KEY_PASSWORD
          fi
          npm run build --prefix ../user
          node scripts/prepare-runtime.mjs
          for required in \
            runtime/bin/node.exe \
            runtime/npm/node_modules/npm/bin/npm-cli.js
          do
            if [[ ! -f "$required" ]]; then
              echo "Bundled runtime is missing $required" >&2
              exit 1
            fi
          done
          npx electron-builder \
            --win nsis \
            --x64 \
            --publish never \
            --config.artifactName='${productName}-${version}-${arch}.${ext}'

      - name: Upload packaged app
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: apps/shell/release/*.exe
          if-no-files-found: error

  release:
    name: Publish Windows release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows apps
        uses: actions/download-artifact@v7
        with:
          pattern: windows-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "MAGI $GITHUB_REF_NAME" \
              || true
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
