name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app

      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Test desktop app
        run: npm test

      - name: Build desktop app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          build_args=()

          # A packaged Electron app must be signed after its contents change.
          # Without a Developer ID certificate, use an ad-hoc signature for
          # local development builds so macOS does not see a stale signature.
          if [[ -z "$CSC_LINK" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            build_args+=(
              --config.mac.identity=-
              --config.mac.hardenedRuntime=false
            )
          fi
          npm run build:app
          node scripts/prepare-runtime.mjs
          npx electron-builder \
            --mac dmg \
            --${{ matrix.arch }} \
            --publish never \
            --config.artifactName='${productName}-${version}-${arch}.${ext}' \
            "${build_args[@]}"
          app_dir="release/mac-${{ matrix.arch }}"
          if [[ "${{ matrix.arch }}" == x64 ]]; then
            app_dir=release/mac
          fi
          codesign --verify --deep --strict "$app_dir/MAGI.app"

      - name: Upload packaged app
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        # The version check below is bash. windows-latest defaults to PowerShell.
        shell: bash

    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app

      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Test desktop app
        run: npm test

      - name: Build desktop app
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # WIN_CSC_LINK is a base64 .pfx, separate from the Apple CSC_LINK secret.
          # With neither set, electron-builder still produces an unsigned installer.
          if [[ -z "${WIN_CSC_LINK:-}" ]]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD CSC_LINK CSC_KEY_PASSWORD
          fi
          npm run build:app
          node scripts/prepare-runtime.mjs
          for required in \
            runtime/bin/node.exe \
            runtime/bin/bun.exe \
            runtime/npm/node_modules/npm/bin/npm-cli.js
          do
            if [[ ! -f "$required" ]]; then
              echo "Bundled runtime is missing $required" >&2
              exit 1
            fi
          done
          npx electron-builder \
            --win nsis \
            --x64 \
            --publish never \
            --config.artifactName='${productName}-${version}-${arch}.${ext}'

      - name: Upload packaged app
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: desktop/release/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [build, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS apps
        uses: actions/download-artifact@v7
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true

      - name: Download Windows apps
        uses: actions/download-artifact@v7
        with:
          pattern: windows-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "MAGI $GITHUB_REF_NAME"
          fi
