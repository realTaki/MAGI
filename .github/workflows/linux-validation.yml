name: Linux DSH validation
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
# DSH source validation only; the Desktop is supplied by DSH.
permissions:
  contents: read
concurrency:
  group: linux-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: DSH plugin lifecycle and contracts (Linux)
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Bootstrap MAGI-owned runtime
        run: |
          npm ci
          npm_execpath="$(npm root -g)/npm/bin/npm-cli.js" node_modules/node/bin/node apps/shell/scripts/prepare-runtime.mjs
      - name: DSH source, resources and complete plugin regression suite
        run: |
          export PATH="$PWD/apps/shell/runtime/bin:$PATH"
          apps/shell/runtime/bin/node apps/shell/runtime/npm/node_modules/npm/bin/npm-cli.js test
