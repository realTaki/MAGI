name: Linux validation
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
# Validation only: MAGI is migrating to DSH plugins; no desktop packages are published.
permissions:
  contents: read
concurrency:
  group: linux-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Native Linux x64 tests and build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Bootstrap MAGI-owned runtime
        run: |
          npm ci
          npm_execpath="$(npm root -g)/npm/bin/npm-cli.js" node_modules/node/bin/node apps/shell/scripts/prepare-runtime.mjs
      - name: Root acceptance and Shell UI build
        run: |
          export PATH="$PWD/apps/shell/runtime/bin:$PATH"
          apps/shell/runtime/bin/node apps/shell/runtime/npm/node_modules/npm/bin/npm-cli.js test
          apps/shell/runtime/bin/node apps/shell/runtime/npm/node_modules/npm/bin/npm-cli.js run lint:i18n --prefix apps/shell
          apps/shell/runtime/bin/node apps/shell/runtime/npm/node_modules/npm/bin/npm-cli.js run build:ui --prefix apps/shell
      - name: EVA self-modification through real process IPC
        run: apps/shell/runtime/bin/node --test apps/shell/integration/self-rebuild.test.mjs
