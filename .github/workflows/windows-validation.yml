name: Windows DSH portable validation (no release)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Portable DSH Client/auth/manifest contracts only; not native Host lifecycle acceptance.
permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: DSH portable Client and bundle contracts (Windows)
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Bootstrap project-owned tools
        run: |
          # setup-node is used only to provision the checkout dependencies.
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Dependency bootstrap failed" }
          # Give the owned Node an explicit bootstrap npm CLI. Windows .cmd
          # shims cannot be passed to execFileSync (EINVAL).
          $env:npm_execpath = Join-Path (Split-Path (Get-Command npm.cmd).Source) "node_modules/npm/bin/npm-cli.js"
          if (!(Test-Path $env:npm_execpath)) { throw "Bootstrap npm CLI is missing" }
          & ./node_modules/node/bin/node.exe apps/shell/scripts/prepare-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw "Runtime preparation failed" }
      - name: DSH source and portable contracts (not POSIX Host lifecycle)
        run: |
          $env:PATH = "$PWD/apps/shell/runtime/bin;$env:PATH"
          & ./apps/shell/runtime/bin/node.exe ./apps/shell/runtime/npm/node_modules/npm/bin/npm-cli.js run test:portable
          if ($LASTEXITCODE -ne 0) { throw "DSH portable acceptance failed" }
