apiVersion: v1
kind: ServiceAccount
metadata:
  name: magi-asp
  namespace: magi
  labels:
    app.kubernetes.io/name: magi-asp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: magi-asp
  namespace: magi
  labels:
    app.kubernetes.io/name: magi-asp
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: magi-asp
  namespace: magi
  labels:
    app.kubernetes.io/name: magi-asp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: magi-asp
subjects:
  - kind: ServiceAccount
    name: magi-asp
    namespace: magi
