# Bundled scheduled-task templates.  These records are synchronised into the
# task_presets table whenever MAGI starts.  Edit this file during development;
# do not edit SQLite directly.  Each key and id is stable because existing
# per-user tasks retain a back-pointer to the preset that created them.
presets:
  - id: "01J9HZ0000DAILYSTAND000UPBR"
    key: daily_standup_brief
    name: 每日晨报
    description: 每个工作日 09:00 推送当日待办摘要 + 昨日完成情况。
    prompt: >-
      You are generating a brief morning summary for the assigned user.
      Today's open tasks: {tasks_open}. Yesterday's completed tasks:
      {tasks_done}. Urgent action items: {action_items}. Write a concise
      (under 120 words) stand-up brief in the user's preferred language.
      Highlight anything due today, any blockers, and a single suggested
      focus for the morning.
    frequency: daily
    hour: 9
    minute: 0
    day_of_week: null
    day_of_month: null
    run_at: null
    channel: tg
    enabled: true

  - id: "01J9HZ0000WEEKLYREVIE0W000"
    key: weekly_review
    name: 周回顾
    description: 每周五 17:00 推送本周完成情况 + 下周建议。
    prompt: >-
      You are generating a Friday-evening weekly review for the assigned
      user. Tasks completed this week: {tasks_done_week}. Tasks still pending:
      {tasks_open_week}. Action items created or completed this week:
      {action_items_week}. Write a concise (under 180 words) review covering:
      what got done, what carried over, what blocked progress, and three
      suggested focus areas for next week. Reply in the user's preferred
      language.
    frequency: weekly
    hour: 17
    minute: 0
    day_of_week: 4
    day_of_month: null
    run_at: null
    channel: tg
    enabled: true

  - id: "01J9HZ0000MORNINGBRIE0B0"
    key: morning_brief
    name: 早报
    description: 每个工作日 08:00 推送当日邮件高光 + 今日行程 + 待办提醒。
    prompt: >-
      你正在生成早报。按以下顺序拉数据：(1) 调用 read_recent_emails(hours=24)
      拉取过去 24h 邮件；(2) 调用 read_upcoming_meetings(days=1) 拿今日日程；
      (3) 用 search_contacts 或 read_daily_note 看相关人物的最新备注和今天积累的
      daily_note。最后按三段结构输出：邮件高光 / 今日行程 / 待办提醒。语气如同事在群里
      发消息——简洁、直接，避免"很荣幸为你服务"之类的套话。优先使用中文。
    frequency: daily
    hour: 8
    minute: 0
    day_of_week: null
    day_of_month: null
    run_at: null
    channel: tg
    enabled: true

  - id: "01J9HZ0000NIGHTSUMMAR0Y0"
    key: night_summary
    name: 晚报
    description: 每天 22:00 推送当日完成情况 + 明早首个会议。
    prompt: >-
      你正在生成晚报。按以下顺序拉数据：(1) 调用 read_recent_emails(hours=24)
      看下午 / 晚上的邮件；(2) 调用 read_upcoming_meetings(days=2) 看今晚 + 明早会议；
      (3) 读今天的 daily_note 总结今天做完了什么。最后按三段结构输出：今日完成 /
      明日首会 / 待办提醒。语气如同事在群里发消息——简洁、直接。优先使用中文。
    frequency: daily
    hour: 22
    minute: 0
    day_of_week: null
    day_of_month: null
    run_at: null
    channel: tg
    enabled: true
