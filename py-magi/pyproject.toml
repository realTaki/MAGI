[project]
name = "magi"
version = "0.1.0"
description = "MAGI — Modular Agentic Group Intelligence. Localized enterprise agent system with ADAM (control plane) and one EVA (Extended Virtual Agent) per employee over Telegram."
authors = [
    { name = "Taki", email = "taki.wang@ualberta.ca" }
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # ADAM web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Validation / settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Schema migrations run during every node boot, including EVA. Keep
    # Alembic on the core runtime path rather than behind the ADAM extra.
    "alembic>=1.13.0",
    # HTTP client (used by EVA's agent_client and llm/ollama)
    "httpx>=0.27.0",
    # SKILL.md frontmatter parser (skills/ loader) — keep
    # PyYAML on the critical path so the operator's
    # skills parse correctly on every install. The
    # loader also has a tiny line-prefix fallback for
    # flat ``key: value`` shapes if PyYAML is missing.
    "pyyaml>=6.0",
    # Structured logging
    "structlog>=24.4.0",
]

[project.optional-dependencies]
# Phase 1 baseline extras (used by ADAM & EVA at runtime)
adam = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "jinja2>=3.1.4",
    # D.X — MCP (Model Context Protocol) client. Optional:
    # the tool loader falls back gracefully when this lib
    # is missing or when no mcp.json is configured, so
    # an ADAM install without MCP just runs without the
    # MCP tool wedge. Listed as required because the
    # typical ADAM deployment uses MCP.
    "mcp>=1.0.0",
]
eva = [
    "python-telegram-bot[ext]>=21.7",
    "apscheduler>=3.10.4",
    "croniter>=2.0.0",  # v3 scheduledTaskBook + TaskWorker (replaces apscheduler cron parsing)
    "anthropic>=0.39.0",
    "openai>=1.54.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
# Single entry point. Whether the process plays ADAM or EVA is decided at
# runtime by MAGI_NODE_ROLE (see `magi.__main__`). One image, one binary,
# one supply chain.
magi = "magi.__main__:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat package layout: pyproject.toml and the `magi` Python package both live
# directly under py-magi/. ``module-root = ""`` (empty) means
# "look for the package directly under the project root" instead of the
# default ``src/`` layout.
module-name = "magi"
module-root = ""

[tool.uv]
# Single project, NOT a workspace — see architecture plan.
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are requested for their side effects (DB setup, test
# isolation, monkeypatching). Removing them silently drops the setup
# rather than erroring, so we exempt the whole tests/ tree from ARG001.
"tests/**" = ["ARG001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# -----------------------------------------------------------------------------
# pyright / Pylance — exclude directories that don't need to be indexed.
# The defaults scan ``.venv`` (305 MB of site-packages) and ``node_modules``
# (103 MB of JS deps under the sibling ``app`` project), which blows Pylance's RSS up to
# ~1.9 GB. These globs are relative to the project root.
# -----------------------------------------------------------------------------
[tool.pyright]
# Resolve third-party imports (sqlalchemy, alembic, …) from the
# project venv without adding site-packages to the *project* index.
venvPath = "."
venv = ".venv"
exclude = [
    "**/.venv/**",
    "**/node_modules/**",
    "**/__pycache__/**",
    "**/.mypy_cache/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/.git/**",
    "**/dist/**",
    "**/build/**",
    "**/.vite/**",
    "**/coverage/**",
    "**/deploy/**",
    "**/docs/**",
    "**/.agents/**",
    "**/.claude/**",
    "**/.codebuddy/**",
    "**/.codex/**",
]
# Don't auto-add site-packages to the import search path — that's what
# drags ``.venv`` into Pylance's index in the first place.
extraPaths = []
# Skip parsing third-party source for type info; saves another ~30% memory.
useLibraryCodeForTypes = false
