# Template consumed by bootstrap-local.sh. The script replaces
# __MAGI_REPO_ROOT__ with the absolute checkout path before piping this into
# kind, so Pods can use the node-visible /mnt/magi hostPath mounts below.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: __MAGI_REPO_ROOT__
        containerPath: /mnt/magi
