# Template consumed by bootstrap-local.sh. The script replaces
# __MAGI_REPO_ROOT__ with the absolute checkout path before piping this into
# kind, so Pods can use the node-visible /mnt/magi hostPath mounts below.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: __MAGI_REPO_ROOT__
        containerPath: /mnt/magi
    # Alice is exposed by the local-only NodePort 30069. Map it to the
    # familiar host WebUI port so a browser can use localhost:42069 directly.
    extraPortMappings:
      - containerPort: 30069
        hostPort: 42069
        listenAddress: "127.0.0.1"
        protocol: TCP
