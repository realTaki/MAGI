# Copy outside Git as magis-genesis-db.yaml and replace both values.
# The URL is mounted only into MAGI nodes that directly belong to Genesis.
apiVersion: v1
kind: Secret
metadata:
  name: magi-magis-1-genesis-db
  namespace: magi
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_VALUE
  MAGIS_DATABASE_URL: postgresql+psycopg://magi:REPLACE_WITH_A_LONG_RANDOM_VALUE@magi-magis-1-genesis-db:5432/magis_1
