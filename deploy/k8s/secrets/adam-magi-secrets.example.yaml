# Example only. Replace every placeholder and apply this file locally.
# Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: adam-magi-secrets
  namespace: magi
type: Opaque
stringData:
  # Needed only if ADAM also mounts the telegram channel.
  MAGI_BOT_TOKEN: replace-with-telegram-bot-token
  # Needed when ADAM/EVA RPC authentication is enabled.
  MAGI_SHARED_SECRET: replace-with-a-long-random-secret
