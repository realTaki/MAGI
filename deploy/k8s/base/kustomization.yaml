apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The workspace is a persistent data boundary. Source code remains inside
# the immutable container image at /app/magi; only /workspace is mounted.
namespace: magi

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
