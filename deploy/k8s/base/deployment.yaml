apiVersion: apps/v1
kind: Deployment
metadata:
  name: magi-node
  labels:
    app.kubernetes.io/name: magi
    app.kubernetes.io/component: node
spec:
  # SQLite is the default state backend, so do not run multiple replicas
  # against the same PVC. Horizontal scaling requires PostgreSQL first.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: magi
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magi
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: magi
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: provision-genesis
          image: magi:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["magi", "init"]
          env:
            - name: MAGIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: magi-magis-1-genesis-db
                  key: MAGIS_DATABASE_URL
          volumeMounts:
            - name: workspace
              mountPath: /
      containers:
        - name: magi
          image: magi:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["magi", "node", "run", "--foreground"]
          envFrom:
            - configMapRef:
                name: magi-config
          # Optional so a WebUI-only ADAM can start without a Secret. Add
          # the key when MAGI_CHANNELS includes telegram or when ADAM/EVA
          # RPC authentication is enabled.
          env:
            # HOST_WORKSPACE_DIR is intentionally NOT set in K8s deployments.
            # The container cannot operate on the host filesystem, so the
            # value is meaningless; :func:`magi.startup.paths.resolve_host_workspace`
            # detects K8s mode via ``KUBERNETES_SERVICE_HOST`` and defaults
            # to ``/``.  Operators who want a non-root inner mount may still
            # override (e.g. for selinux relabel workarounds), but the
            # canonical deployment relies on the auto-detected default.
            #
            # The initial MAGI has the deterministic first registry ID. Every
            # runtime must know its ID so it can reject proxy requests meant
            # for another MAGI.
            - name: MAGI_RUNTIME_ID
              value: "1"
            - name: MAGIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: magi-magis-1-genesis-db
                  key: MAGIS_DATABASE_URL
            # The ADAM image cannot call the Kubernetes API. It holds only an
            # HMAC secret for the narrow internal orchestrator API.
            - name: MAGI_ORCHESTRATOR_URL
              value: http://magi-orchestrator:42100
            - name: MAGI_CONTROL_SECRET
              valueFrom:
                secretKeyRef:
                  name: magi-control
                  key: MAGI_CONTROL_SECRET
                  optional: true
            - name: MAGI_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: magi-secrets
                  key: MAGI_BOT_TOKEN
                  optional: true
            - name: MAGI_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: magi-secrets
                  key: MAGI_SHARED_SECRET
                  optional: true
          ports:
            - name: http
              containerPort: 42070
              protocol: TCP
          volumeMounts:
            # The PVC is mounted at the container root, so the workspace
            # derivation ``<HOST>/MAGI_Citizens/<MAGI_NAME>`` lands on
            # the volume.  ``HOST_WORKSPACE_DIR`` auto-defaults to ``/``
            # inside the Pod.
            - name: workspace
              mountPath: /
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: magi-workspace
