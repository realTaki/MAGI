apiVersion: apps/v1
kind: Deployment
metadata:
  name: magi-orchestrator
  labels:
    app.kubernetes.io/name: magi
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: magi
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magi
        app.kubernetes.io/component: orchestrator
    spec:
      serviceAccountName: magi-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: magi:0.1.0
          imagePullPolicy: IfNotPresent
          # The startup refactor consolidated the orchestrator FastAPI app
          # into magi.startup.orchestrator_service.create_app (plan §20.4).
          # ``--factory`` lets uvicorn call our factory instead of an ASGI
          # module-level ``app`` symbol.
          command: ["python", "-m", "uvicorn"]
          args: ["magi.startup.orchestrator_service:create_app", "--factory", "--host", "0.0.0.0", "--port", "42100"]
          envFrom:
            - configMapRef:
                name: magi-orchestrator-config
          env:
            - name: MAGI_CONTROL_SECRET
              valueFrom:
                secretKeyRef:
                  name: magi-control
                  key: MAGI_CONTROL_SECRET
          ports:
            - name: http
              containerPort: 42100
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
