apiVersion: v1
kind: Service
metadata:
  name: magi-orchestrator
  labels:
    app.kubernetes.io/name: magi
    app.kubernetes.io/component: orchestrator
spec:
  # The local Kind control plane can lag EndpointSlice readiness updates after
  # a container restart. The orchestrator still exposes its own health probe;
  # publishing this internal-only endpoint keeps ADAM's control path stable.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: magi
    app.kubernetes.io/component: orchestrator
  ports:
    - name: http
      port: 42100
      targetPort: http
