apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local kind-only development overlay. /mnt/magi is supplied by kind's
# extraMounts from deploy/k8s/kind.dev.yaml; never apply it to production.
resources:
  - ../../base

namePrefix: eva00-

patches:
  - path: patch-config.yaml
  - path: patch-deployment.yaml
  - path: patch-service.yaml
  - target:
      version: v1
      kind: Service
      name: magi
    path: patch-service.json
  - path: patch-delete-pvc.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: magi-node
    path: patch-workspace.json
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: magi-node
    path: patch-probes.json
