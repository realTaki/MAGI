# MAGI docker-compose — minimal local deployment.
#
# Single image, one service: Adam. Eve containers are not
# defined here yet — they land in C6 via the Adam Web UI
# dispatch button, which renders per-employee compose files.
#
# Configuration lives in the SQLite database. Hardcoded
# constants live in ``magi/constants.py``. The only
# compose-time variable is MAGI_WORKSPACE_DIR (host-side
# bind-mount source). Inside the container the workspace is
# always at /workspace (hardcoded).
#
# C0: Adam serves /health + WebUI on :42069. SQLite at
# /workspace/memories/magi.db inside the container.

name: magi

x-magi-base: &magi-base
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped

services:
  adam:
    <<: *magi-base
    env_file: ../.env
    ports:
      - "42069:42069"
    volumes:
      - "${MAGI_WORKSPACE_DIR:?MAGI_WORKSPACE_DIR must be set to an absolute path in deploy/.env}/Adam:/workspace"
