# MAGI dev-mode compose override.
#
# Usage:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# The base compose (docker-compose.yml) is the production deployment.
# This override swaps it for the dev image (Dockerfile.dev) which has
# both Python and Node, mounts the source tree, and runs Vite alongside
# magi.

services:
  adam:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    image: magi:dev
    env_file: ../.env
    environment:
      MAGI_RELOAD: "1"
      TZ: ${HOST_TZ:-UTC}
      PYTHONPATH: /app
      VITE_BACKEND_URL: "http://127.0.0.1:8000"
    volumes:
      - ../../magi:/app/magi:ro
      - magi_web_node_modules:/app/magi/WebUI/node_modules
      - ../entrypoint.dev.sh:/usr/local/bin/entrypoint.sh:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 114.114.114.114
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    ports:
      - "42069:42069"

volumes:
  magi_web_node_modules:
