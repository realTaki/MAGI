apiVersion: apps/v1
kind: Deployment
metadata:
  name: magi-node
spec:
  template:
    spec:
      # Dockerfile.dev runs as root so npm can initialise its emptyDir cache.
      # This exception is confined to the local kind overlay.
      securityContext:
        runAsNonRoot: false
        fsGroup: 0
      containers:
        - name: magi
          image: magi:dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/entrypoint.sh"]
          env:
            # k8s-dev: K8s mode is auto-detected via
            # ``KUBERNETES_SERVICE_HOST``; ``HOST_WORKSPACE_DIR`` is
            # intentionally NOT set so ``resolve_host_workspace()``
            # defaults to ``/`` inside the Pod. The kind extraMounts
            # in ``deploy/k8s-dev/kind.yaml`` and the hostPath volume
            # entries below are what makes ``/MAGI_Citizens/<name>``
            # resolve to the operator's ``~/.magi`` on the host.
            - name: MAGI_ORCHESTRATOR_URL
              value: http://magi-orchestrator:42100
            - name: MAGIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: magi-magis-1-genesis-db
                  key: MAGIS_DATABASE_URL
            - name: MAGIS_ID
              value: "1"
          # `magi --check` opens the same SQLite state as the reloading
          # development process. Probe the Vite dev server instead so probes
          # do not contend with the dev instance's local state database.
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: magis-workspace
              mountPath: /magis
            - name: source
              mountPath: /app/magi
              readOnly: true
            - name: web-node-modules
              mountPath: /app/magi/WebUI/node_modules
            - name: dev-entrypoint
              mountPath: /usr/local/bin/entrypoint.sh
              readOnly: true
