apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local kind-only development overlay. /mnt/magi is supplied by kind's
# extraMounts from deploy/k8s-dev/kind.yaml; never apply it to production.
# The MAGI-node base is shared with the production deploy tree at
# deploy/k8s/base/ — only the dev-specific patches live here.
resources:
  - ../../../k8s/base

secretGenerator:
  - name: magi-magis-1-genesis-db
    literals:
      - POSTGRES_PASSWORD=magi-dev-postgres-password
      - MAGIS_DATABASE_URL=postgresql+psycopg://magi:magi-dev-postgres-password@magi-magis-1-genesis-db:5432/magis_1
    options:
      disableNameSuffixHash: true

patches:
  - path: patch-config.yaml
  - path: patch-deployment.yaml
  - path: patch-delete-pvc.yaml
  - path: patch-delete-magis-workspace-pvc.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: magi-node
    path: patch-workspace.json
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: magi-node
    path: patch-probes.json
