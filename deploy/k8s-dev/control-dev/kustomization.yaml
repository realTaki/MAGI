apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kind-only unified WebUI: same magi:dev image as the runtime, with Vite HMR
# on :42069 and the control API on :8000 inside the Pod.
resources:
  - ../../k8s/control

patches:
  - path: patch-webui.yaml
  - path: patch-webui-volumes.json
    target:
      group: apps
      version: v1
      kind: Deployment
      name: magi-webui
  - path: patch-webui-service.yaml
