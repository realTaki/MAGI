<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="MAGI home">MAGI</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Overview</a>
          <a href="{{ '/architecture/' | relative_url }}">Architecture</a>
          <a href="{{ '/business-flows/' | relative_url }}">Flows</a>
          <a href="{{ '/terms/' | relative_url }}">Terms</a>
          <a href="{{ '/roadmap/' | relative_url }}">Roadmap</a>
          <a href="{{ '/insights/designing-for-abundant-intelligence/' | relative_url }}">Insights</a>
        </nav>
        <a class="repo-link" href="{{ site.github.repository_url | default: 'https://github.com/AgenticSocietyLab/MAGI' }}">GitHub ↗</a>
      </div>
    </header>

    <main class="shell {% if page.home %}home{% else %}document{% endif %}">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>MAGI — persistent, modular, governable agent societies.</span>
        <a href="{{ site.github.repository_url | default: 'https://github.com/AgenticSocietyLab/MAGI' }}">Source code</a>
      </div>
    </footer>
  </body>
</html>
