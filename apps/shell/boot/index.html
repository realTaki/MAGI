<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAGI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="startup-drag"></div>
    <main class="view startup">
      <div class="progress">
        <div
          class="progress-track"
          role="progressbar"
          aria-label="MAGI startup progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="startup-progress" class="progress-fill"></div>
        </div>
        <span id="startup-percent" class="progress-percent">0%</span>
      </div>

      <p id="startup-step" class="status" role="status" aria-live="polite">Starting…</p>

      <section id="startup-error-panel" class="error-panel" role="alert" hidden>
        <textarea
          id="startup-error"
          class="error-text"
          aria-label="Startup error details"
          readonly
          spellcheck="false"
        ></textarea>
        <div class="error-actions">
          <button type="button" class="icon-button" id="copy-startup-error" aria-label="Copy error" title="Copy error">
            <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="8" width="12" height="12" rx="2" />
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
            </svg>
            <svg class="copied-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m5 12 4 4L19 6" />
            </svg>
          </button>
          <button type="button" class="icon-button icon-button-primary" id="retry-startup" aria-label="Retry startup" title="Retry startup">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.2 6" />
              <path d="M20 4v7h-7" />
            </svg>
          </button>
        </div>
        <span id="copy-status" class="sr-only" role="status" aria-live="polite"></span>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
